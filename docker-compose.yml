services:
  zookeeper-ride:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - raijmobi-network

  kafka-ride:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper-ride
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-ride:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-ride:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - raijmobi-network

  ride-app:
    build: .
    container_name: ride-service
    command: >
      sh -c "python manage.py makemigrations --noinput &&
         python manage.py migrate &&
         python manage.py collectstatic --noinput &&
         python core/consumer.py &
         uvicorn ride_service.asgi:application --host 0.0.0.0 --port 8000"
    ports:
      - "8004:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS_USER=kafka-user:9092
      - KAFKA_BOOTSTRAP_SERVERS_RIDE=kafka-ride:9092
      - ALLOWED_HOSTS=*
      - AI_PROVIDER=ollama
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    networks:
      - raijmobi-network

networks:
  raijmobi-network:
    external: true

volumes:
  media_volume:
  static_volume:
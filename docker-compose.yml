services:
  ride-app:
    build: .
    container_name: ride-service
    command: >
      sh -c "python manage.py makemigrations &&
            python manage.py migrate &&
            python manage.py collectstatic --noinput &&
            uvicorn ride_service.asgi:application --host 0.0.0.0 --port 8000"
    ports:
      - "8004:8000"
    environment:
      - ALLOWED_HOSTS=*
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    networks:
      - raijmobi-network

networks:
  raijmobi-network:
    external: true

volumes:
  media_volume:
  static_volume: